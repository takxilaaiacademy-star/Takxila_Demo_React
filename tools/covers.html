<!doctype html>
<html lang="en">
<!-- Course cover template. tools/render-covers.mjs opens covers.html#<course-id> and screenshots it at 1125x330.
     Every course gets its own colours and a scene that shows what the course is about. -->
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1125px; height: 330px; overflow: hidden; }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #fff; position: relative; background: var(--bg); }
  .glow { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.12) 1px, transparent 1px); background-size: 22px 22px;
    mask-image: linear-gradient(90deg, transparent 30%, #000 70%); }
  .left { position: absolute; left: 40px; top: 26px; bottom: 26px; width: 520px; display: flex; flex-direction: column; z-index: 3; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .14em; font-size: 15px; }
  .brand img { height: 30px; }
  .badge { align-self: flex-start; margin-top: 16px; padding: 6px 14px; border-radius: 99px; font-size: 12.5px; font-weight: 800; letter-spacing: .1em; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); color: var(--acc); }
  h1 { font-size: 33px; line-height: 1.08; letter-spacing: -.02em; margin-top: 12px; font-weight: 800; }
  h1 span { color: var(--acc); display: block; }
  .sub { margin-top: 8px; font-size: 14px; color: rgba(255,255,255,.72); font-weight: 600; }
  .buy { margin-top: auto; display: flex; gap: 12px; align-items: stretch; }
  .price { display: flex; border-radius: 12px; overflow: hidden; font-weight: 800; box-shadow: 0 10px 26px rgba(0,0,0,.3); }
  .price .off { background: #E5383B; padding: 10px 14px; font-size: 15px; display: flex; align-items: center; }
  .price .amt { background: var(--acc); color: var(--accInk); padding: 8px 16px; font-size: 25px; display: flex; align-items: center; gap: 8px; }
  .price .amt s { font-size: 15px; opacity: .65; font-weight: 700; }
  .price .amt small { font-size: 13px; letter-spacing: .06em; }
  .dur { display: flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25); font-weight: 800; font-size: 16px; background: rgba(255,255,255,.06); }
  .dur svg { width: 18px; height: 18px; }

  .scene { position: absolute; left: 590px; top: 22px; width: 505px; height: 286px; z-index: 2; }
  .card { position: absolute; border-radius: 16px; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.18); backdrop-filter: blur(10px); box-shadow: 0 24px 50px rgba(0,0,0,.35); overflow: hidden; }
  .light { background: #fff; color: #1b1f33; border-color: rgba(255,255,255,.6); }
  .bar { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 1px solid rgba(255,255,255,.12); font-size: 12px; font-weight: 700; color: rgba(255,255,255,.8); }
  .light .bar { border-color: #e8ebf3; color: #59607a; }
  .bar i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.35); display: inline-block; }
  .bar i:nth-child(1) { background: #ff5f57; } .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; }
  .bar b { margin-left: 8px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .bubble { padding: 9px 12px; border-radius: 14px; font-size: 13px; line-height: 1.4; font-weight: 600; max-width: 82%; }
  .me { margin-left: auto; background: var(--acc); color: var(--accInk); border-bottom-right-radius: 4px; }
  .ai { background: rgba(255,255,255,.1); border-bottom-left-radius: 4px; }
  .light .ai { background: #f1f3f9; }
  .ln { height: 8px; border-radius: 4px; background: rgba(255,255,255,.22); margin-top: 7px; }
  .light .ln { background: #e3e6ef; }
  .pill { padding: 5px 10px; border-radius: 99px; font-size: 11.5px; font-weight: 800; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); white-space: nowrap; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; font-size: 20px; box-shadow: 0 12px 26px rgba(0,0,0,.3); }
  .ico svg { width: 24px; height: 24px; }
  .chip { position: absolute; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: #fff; color: #1b1f33; font-weight: 800; font-size: 12.5px; box-shadow: 0 14px 30px rgba(0,0,0,.35); white-space: nowrap; }
  .chip em { font-style: normal; color: #18a058; }
  .tile { border-radius: 10px; position: relative; overflow: hidden; }
  .tile::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.45), transparent 45%); }
  .wave { display: flex; align-items: center; gap: 3px; height: 50px; }
  .wave span { width: 4px; border-radius: 3px; background: var(--acc); }
</style>
</head>
<body>
<div class="glow" style="width:420px;height:420px;right:-60px;top:-160px;background:var(--g1)"></div>
<div class="glow" style="width:360px;height:360px;left:420px;bottom:-230px;background:var(--g2)"></div>
<div class="dots"></div>
<div class="left">
  <div class="brand"><img src="../public/assets/logo-mark-dark.webp" alt="" />TAKXILA ™</div>
  <div class="badge" id="badge"></div>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="buy" id="buy"></div>
</div>
<div class="scene" id="scene"></div>

<script>
// ---------- Icons (inline SVG paths) ----------
const P = {
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',
  img: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>',
  text: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 6h14M5 12h14M5 18h9"/></svg>',
  video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
  code: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg>',
  bolt: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M4 17l6-6 4 4 6-7M15 8h5v5"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0z"/></svg>',
  file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></svg>',
  music: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 17.5a3 3 0 11-2-2.8V5l12-2v11.5a3 3 0 11-2-2.8V6.4L9 7.8z"/></svg>',
  globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>',
  cart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 4h2l2.4 11h10.2L20 8H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg>',
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
  rupee: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 4h11M7 9h11M7 4c6 0 6 10 0 10h-1l8 7"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.8 5.8 6.2.8-4.6 4.3 1.2 6.2L12 17l-5.6 3.1 1.2-6.2L3 9.6l6.2-.8z"/></svg>',
};
const ico = (k, bg, fg = '#fff', extra = '') => `<div class="ico" style="background:${bg};color:${fg};${extra}">${P[k]}</div>`;
const lines = (n, w = [90, 70, 80, 60]) => Array.from({ length: n }, (_, i) => `<div class="ln" style="width:${w[i % w.length]}%"></div>`).join('');
const pos = (l, t, w, h) => `left:${l}px;top:${t}px;width:${w}px;${h ? 'height:' + h + 'px;' : ''}`;
const grad = (a, b, deg = 135) => `linear-gradient(${deg}deg, ${a}, ${b})`;

// ---------- Scenes ----------
const S = {
  // A chat app: the course tool answering a prompt.
  chat: ({ app, logo, prompt, reply, side, chips = [] }) => `
    <div class="card" style="${pos(40, 18, 400, 236)}">
      <div class="bar"><i></i><i></i><i></i><b>${app}</b></div>
      <div style="display:flex;height:206px">
        ${side ? `<div style="width:112px;border-right:1px solid rgba(255,255,255,.12);padding:10px 8px;font-size:11px;font-weight:700;color:rgba(255,255,255,.7)">${side.map((s, i) => `<div style="padding:6px 8px;border-radius:8px;margin-bottom:4px;${i === 0 ? 'background:rgba(255,255,255,.12);color:#fff' : ''}">${s}</div>`).join('')}</div>` : ''}
        <div style="flex:1;padding:14px;display:flex;flex-direction:column;gap:10px">
          <div class="bubble me">${prompt}</div>
          <div class="row" style="align-items:flex-start">${logo}<div class="bubble ai" style="flex:1">${reply}${lines(2, [92, 64])}</div></div>
          <div style="margin-top:auto;display:flex;gap:6px;flex-wrap:wrap">${chips.map((c) => `<span class="pill">${c}</span>`).join('')}</div>
        </div>
      </div>
    </div>`,
  terminal: ({ cmds }) => `
    <div class="card" style="${pos(30, 14, 420, 240)};background:#0d1117">
      <div class="bar"><i></i><i></i><i></i><b class="mono">~/my-app — claude</b></div>
      <div class="mono" style="padding:14px 16px;font-size:13px;line-height:1.75">${cmds.join('<br>')}</div>
    </div>`,
  sheet: ({ formula, head, rows, bars }) => `
    <div class="card light" style="${pos(20, 20, 330, 230)}">
      <div class="bar" style="background:#107c41;color:#fff;border:0"><b style="margin:0">Sheet1.xlsx</b></div>
      <div class="mono" style="font-size:11.5px;padding:6px 10px;border-bottom:1px solid #e8ebf3;color:#107c41"><b>fx</b> ${formula}</div>
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <tr>${head.map((h) => `<th style="background:#f3f5f9;padding:6px 8px;text-align:left;border:1px solid #e8ebf3">${h}</th>`).join('')}</tr>
        ${rows.map((r, i) => `<tr>${r.map((c, j) => `<td style="padding:6px 8px;border:1px solid #eef0f5;${i === rows.length - 1 ? 'font-weight:800;background:#e9f7ef' : ''}${j ? ';text-align:right' : ''}">${c}</td>`).join('')}</tr>`).join('')}
      </table>
    </div>
    <div class="card light" style="${pos(300, 110, 190, 150)};padding:12px">
      <div style="font-size:12px;font-weight:800;color:#59607a">Monthly trend</div>
      <div style="display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:10px">${bars.map((b, i) => `<div style="flex:1;height:${b}%;border-radius:5px 5px 0 0;background:${i === bars.length - 1 ? 'var(--acc)' : '#c9d6f5'}"></div>`).join('')}</div>
    </div>`,
  gallery: ({ prompt, tiles, tag, cols = 3 }) => `
    <div class="card" style="${pos(30, 10, 440, 266)};padding:12px">
      <div class="row mono" style="padding:9px 12px;border-radius:10px;background:rgba(0,0,0,.35);font-size:12.5px"><span style="color:var(--acc)">${tag}</span><span style="opacity:.9">${prompt}</span></div>
      <div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:8px;margin-top:10px;height:196px">${tiles.map((t) => `<div class="tile" style="background:${t}"></div>`).join('')}</div>
    </div>`,
  editor: ({ preview, label, clips, overlay = '' }) => `
    <div class="card" style="${pos(20, 8, 460, 270)};background:#0f1220">
      <div class="bar"><i></i><i></i><i></i><b>${label}</b></div>
      <div style="margin:10px 12px;height:142px;border-radius:10px;background:${preview};position:relative;overflow:hidden">
        ${overlay}
        <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.9);color:#111;display:grid;place-items:center">${P.play.replace('<svg', '<svg width="22" height="22"')}</div>
      </div>
      <div style="padding:0 12px">${clips.map((row) => `<div style="display:flex;gap:4px;margin-bottom:5px">${row.map(([w, c]) => `<div style="flex:${w};height:18px;border-radius:5px;background:${c}"></div>`).join('')}</div>`).join('')}</div>
      <div style="position:absolute;left:150px;top:182px;bottom:12px;width:2px;background:#ff4d4f"></div>
    </div>`,
  ad: ({ brand, platform, img, metrics, curve }) => `
    <div class="card light" style="${pos(20, 6, 230, 274)}">
      <div class="row" style="padding:10px"><div style="width:30px;height:30px;border-radius:50%;background:${grad('#f9ce34', '#ee2a7b')}"></div><div><div style="font-weight:800;font-size:12.5px">${brand}</div><div style="font-size:10.5px;color:#8a90a6">Sponsored · ${platform}</div></div></div>
      <div style="height:150px;background:${img};position:relative"><div style="position:absolute;left:12px;bottom:12px;font-weight:800;font-size:18px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4)">Summer Sale<br>40% OFF</div></div>
      <div class="row" style="padding:10px;justify-content:space-between"><span style="color:#e0245e;display:flex;gap:4px;align-items:center;font-weight:800;font-size:12px">${P.heart.replace('<svg', '<svg width="16" height="16"')} 2.4k</span><span style="background:#1877f2;color:#fff;font-weight:800;font-size:12px;padding:6px 12px;border-radius:8px">Shop now</span></div>
    </div>
    <div class="card" style="${pos(270, 40, 225, 190)};padding:14px">
      <div style="font-size:12px;font-weight:800;opacity:.8">Campaign results</div>
      <div style="display:flex;gap:10px;margin-top:8px">${metrics.map(([k, v]) => `<div><div style="font-size:20px;font-weight:800;color:var(--acc)">${v}</div><div style="font-size:10.5px;opacity:.7;font-weight:700">${k}</div></div>`).join('')}</div>
      <svg viewBox="0 0 200 80" style="width:100%;height:80px;margin-top:8px"><path d="${curve}" fill="none" stroke="var(--acc)" stroke-width="3.5" stroke-linecap="round"/><path d="${curve} L200 80 L0 80Z" fill="var(--acc)" opacity=".15"/></svg>
    </div>`,
  serp: ({ query, results }) => `
    <div class="card light" style="${pos(20, 12, 450, 262)};padding:14px 16px">
      <div class="row" style="border:1px solid #dfe3ec;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600;color:#3c4257">${P.search.replace('<svg', '<svg width="16" height="16" style="color:#4285f4"')} ${query}</div>
      ${results.map(([url, title, rank], i) => `<div style="margin-top:12px;padding:${i === 0 ? '10px' : '0 10px'};border-radius:10px;${i === 0 ? 'background:#eef6ee;border:1px solid #bfe3c5' : ''}">
        <div class="row" style="justify-content:space-between"><span style="font-size:11px;color:#3c7a3f;font-weight:700">${url}</span>${rank ? `<span style="font-size:11px;font-weight:800;background:#18a058;color:#fff;padding:3px 8px;border-radius:99px">${rank}</span>` : ''}</div>
        <div style="font-size:15px;color:#1a0dab;font-weight:700;margin-top:2px">${title}</div>${lines(1, [86])}</div>`).join('')}
    </div>`,
  kanban: ({ cols }) => `
    <div class="card" style="${pos(10, 10, 480, 266)};padding:12px;display:flex;gap:10px">
      ${cols.map(([name, color, cards]) => `<div style="flex:1;background:rgba(0,0,0,.18);border-radius:12px;padding:10px">
        <div class="row" style="font-size:12px;font-weight:800;margin-bottom:8px"><span style="width:8px;height:8px;border-radius:50%;background:${color}"></span>${name}<span style="margin-left:auto;opacity:.6">${cards.length}</span></div>
        ${cards.map((c) => `<div style="background:#fff;color:#1b1f33;border-radius:9px;padding:8px 9px;margin-bottom:7px;font-size:11.5px;font-weight:700;box-shadow:0 4px 10px rgba(0,0,0,.15)">${c}<div style="height:4px;border-radius:3px;margin-top:6px;background:${color};width:${40 + c.length * 2}%"></div></div>`).join('')}
      </div>`).join('')}
    </div>`,
  browser: ({ url, hero, prompt, blocks }) => `
    <div class="card light" style="${pos(60, 8, 420, 250)}">
      <div class="bar"><i></i><i></i><i></i><span style="margin-left:10px;flex:1;background:#f1f3f9;border-radius:6px;padding:3px 10px;font-weight:600;color:#59607a">${url}</span></div>
      <div style="height:96px;margin:10px;border-radius:10px;background:${hero};padding:16px;color:#fff;font-weight:800;font-size:18px">${blocks[0]}<div style="margin-top:10px;display:inline-block;background:#fff;color:#111;padding:5px 12px;border-radius:8px;font-size:11px">Get started</div></div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 10px">${blocks.slice(1).map((b) => `<div style="border:1px solid #e8ebf3;border-radius:9px;padding:9px;font-size:11px;font-weight:800">${b}${lines(2, [90, 60])}</div>`).join('')}</div>
    </div>
    ${prompt ? `<div class="card" style="${pos(0, 200, 250, 60)};padding:10px 12px;background:rgba(15,18,32,.92)"><div style="font-size:10.5px;font-weight:800;color:var(--acc)">PROMPT</div><div style="font-size:12.5px;font-weight:600">${prompt}</div></div>` : ''}`,
  jobs: ({ jobs }) => `
    ${jobs.map(([role, co, score, ok], i) => `<div class="card light" style="${pos(20 + i * 30, 6 + i * 90, 380, 78)};padding:12px 14px;display:flex;align-items:center;gap:12px">
      <div style="width:44px;height:44px;border-radius:12px;background:${['#e8f0fe', '#fde8ef', '#e6f7ee'][i]};display:grid;place-items:center;font-weight:800;color:${['#4285f4', '#e0245e', '#18a058'][i]}">${co[0]}</div>
      <div style="flex:1"><div style="font-weight:800;font-size:14px">${role}</div><div style="font-size:11.5px;color:#8a90a6;font-weight:600">${co} · Remote</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:800;color:${score > 80 ? '#18a058' : '#e0a100'}">${score}%</div><div style="font-size:10px;font-weight:800;color:#8a90a6">MATCH</div></div>
      <div style="font-size:11px;font-weight:800;padding:6px 10px;border-radius:8px;background:${ok ? '#18a058' : '#eef0f5'};color:${ok ? '#fff' : '#8a90a6'}">${ok ? 'Applied ✓' : 'Skipped'}</div>
    </div>`).join('')}`,
  calendar: ({ days, done, label, mission }) => {
    const cols = 7;
    return `<div class="card" style="${pos(40, days > 14 ? 10 : 30)};width:400px;padding:14px">
      <div class="row" style="justify-content:space-between"><b style="font-size:14px">${label}</b><span class="pill" style="background:var(--acc);color:var(--accInk);border:0">🔥 ${done}-day streak</span></div>
      <div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:${days > 14 ? 6 : 9}px;margin-top:12px">
        ${Array.from({ length: days }, (_, i) => `<div style="aspect-ratio:${days > 14 ? 1.5 : 1};border-radius:9px;display:grid;place-items:center;font-size:${days > 14 ? 11 : 15}px;font-weight:800;${i < done ? 'background:var(--acc);color:var(--accInk)' : i === done ? 'border:2px solid var(--acc);color:var(--acc)' : 'background:rgba(255,255,255,.08);color:rgba(255,255,255,.55)'}">${i < done ? '✓' : 'D' + (i + 1)}</div>`).join('')}
      </div>

// ---------- Render ----------
const id = decodeURIComponent(location.hash.slice(1)) || 'claude-code';
const cfg = C[id];
const meta = (window.COURSES || {})[id] || {};
if (!cfg) document.body.innerHTML = '<h1 style="padding:40px">Unknown course ' + id + '</h1>';
else {
  const [badge, l1, l2, sub, theme, scene] = cfg;
  const root = document.documentElement.style;
  root.setProperty('--bg', `radial-gradient(120% 140% at 0% 0%, ${theme.bg} 30%, #070a16)`);
  root.setProperty('--acc', theme.acc);
  root.setProperty('--accInk', theme.accInk);
  root.setProperty('--g1', theme.g1);
  root.setProperty('--g2', theme.g2);
  document.body.style.background = `linear-gradient(115deg, ${theme.bg} 0%, ${theme.bg} 45%, #070a16 100%)`;
  document.getElementById('badge').textContent = badge;
  document.getElementById('title').innerHTML = `${l1}<span>${l2}</span>`;
  document.getElementById('sub').textContent = sub;
  const price = meta.price ?? 0, was = meta.was ?? 0;
  const off = was > price && price ? Math.round((1 - price / was) * 100) : 0;
  document.getElementById('buy').innerHTML =
    (price
      ? `<div class="price">${off ? `<div class="off">${off}% OFF</div>` : ''}<div class="amt">₹${price}${was > price ? ` <s>₹${was}</s>` : ''} <small>ONLY</small></div></div>`
      : `<div class="price"><div class="amt">FREE</div></div>`) +
    (meta.dur ? `<div class="dur">${P.clock}${meta.dur}</div>` : '');
  document.getElementById('scene').innerHTML = scene;
}
